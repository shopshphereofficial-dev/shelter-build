name: build-shelter

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Shelter source
        uses: actions/checkout@v4
        with:
          repository: PeterCxy/Shelter
          ref: master
          fetch-depth: 0
          path: shelter

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at $SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$SDK/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Fetch setup-wizard library (submodule mirror)
        run: |
          cd shelter
          rm -rf libs/SetupWizardLibrary
          mkdir -p libs
          git clone --depth 1 -b main https://github.com/PeterCxy/SetupWizardLibrary.git libs/SetupWizardLibrary

      - name: Patch version fields
        run: |
          cd shelter
          sed -i 's/versionCode getVersionCode()/versionCode 16/' app/build.gradle
          sed -i 's/versionName getVersionName()/versionName "1.6"/' app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle | head

      - name: Build debug APK
        run: |
          cd shelter
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shelter-apk
          path: shelter/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
